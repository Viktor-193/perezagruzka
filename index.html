<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Перезагрузка">
<meta name="theme-color" content="#0E0B1D"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Перезагрузка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header + scrolling tab strip, one column of sections up to 760px. Tangerine × Indigo on deep violet night. */
:root{
  --bg:#0E0B1D; --surface:#17132C; --surface2:#211B3D; --line:#2E2752;
  --fg:#EDEAF7; --muted:#9B95BC; --accent:#FF8A3D; --accent-ink:#1A0F05;
  --indigo:#6F66F0; --indigo-soft:#2A2464;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px;
  --inset:var(--bg); --head:var(--bg); --blur:none;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F5F3FB; --surface:#FFFFFF; --surface2:#EEEBF8; --line:#DCD7EE;
  --fg:#1A1533; --muted:#655F86; --accent:#E8641A; --accent-ink:#FFFFFF;
  --indigo:#4338CA; --indigo-soft:#E2E0FB;
  --ok:#15803D; --warn:#B45309; --bad:#DC2626; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F5F3FB; --surface:#FFFFFF; --surface2:#EEEBF8; --line:#DCD7EE;
  --fg:#1A1533; --muted:#655F86; --accent:#E8641A; --accent-ink:#FFFFFF;
  --indigo:#4338CA; --indigo-soft:#E2E0FB;
  --ok:#15803D; --warn:#B45309; --bad:#DC2626; color-scheme:light}

body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 8px}
.logo{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo span{color:var(--accent)}
.daycount{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:7px 12px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

main{display:flex;flex-direction:column;gap:20px;padding-top:18px}
section.card{background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shine,none);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--f-display);font-weight:500;font-size:15px;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.eyebrow{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.notice{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px}
.rule-day{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.35;text-wrap:balance}

.check{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--inset);text-align:left;color:var(--fg);font:500 15px var(--f-body);width:100%}
.check .box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check[aria-pressed="true"] .t{color:var(--muted);text-decoration:line-through}
.check small{display:block;color:var(--muted);font-size:12px;text-decoration:none}
.checks{display:flex;flex-direction:column;gap:6px}
.check.remcheck{flex:0 0 auto;width:auto;min-width:22px;border:0;padding:0;background:transparent;gap:0;margin-right:2px}
.check.setting[aria-pressed="true"] .t{color:var(--fg);text-decoration:none}
.item > .check{flex-shrink:0}
.checks .row > .check{flex:1 1 auto;min-width:0}

.prog{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
@media (prefers-reduced-motion: reduce){.prog i{transition:none}}

.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface2);max-width:100%}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 35%,var(--surface2))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 70%,var(--surface2))}
.heat i[data-l="3"]{background:var(--accent)}
.heat i.today{outline:2px solid var(--indigo);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:500}
.stat span{font-size:12px;color:var(--muted)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0;flex:1 1 180px}
input[type=text],input[type=date],textarea,select{font:15px var(--f-body);color:var(--fg);background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:64px}
.btn{font:600 13px var(--f-body);border-radius:8px;padding:8px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.icon{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;font:600 13px var(--f-body)}
.icon:hover{color:var(--fg);background:var(--surface2)}

.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--inset);min-width:0}
.item .body{flex:1;min-width:0}
.item .title{font-weight:600;overflow-wrap:anywhere}
.item .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.item .acts{display:flex;gap:2px;flex-shrink:0}
.pill{display:inline-block;font:600 11px var(--f-body);padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;background:transparent;cursor:pointer}
.pill.plan{color:var(--muted)} .pill.reading{color:var(--indigo)} .pill.done{color:var(--ok)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
:root .pill.reading{color:color-mix(in srgb,var(--indigo) 80%,var(--fg))}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 12px var(--f-body);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--indigo);color:var(--fg);background:var(--indigo-soft)}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:12px;border:1px dashed var(--line);border-radius:10px}
.confirm{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--bad)}

.topic{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--inset)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.scores{display:flex;flex-direction:column;gap:10px}
.score-row{display:flex;flex-direction:column;gap:6px}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.dots button{font:600 12px var(--f-mono);padding:6px 0;border-radius:6px;border:1px solid var(--line);background:var(--inset);color:var(--muted);cursor:pointer}
.dots button[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.hist{display:flex;gap:3px;align-items:flex-end;height:28px}
.hist i{width:14px;background:var(--indigo);border-radius:3px 3px 0 0;opacity:.85}
.hist i.cur{background:var(--accent)}
a.cal{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none;background:var(--inset)}
a.cal:hover{border-color:var(--accent)}
a.cal span{color:var(--muted);font-size:12px}
.save{font:12px var(--f-mono);color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}

  else { try{ localStorage.setItem("perez:"+key, JSON.stringify(obj)); }catch(e){} }
}
function getDoc(key){ return key==="state" ? S : key==="news" ? NEWS : M[key]; }

/* ---------- sync through a private GitHub repository ---------- */
const SY = {cfg:null, meta:{sha:{}, dirty:[]}, busy:false, again:false, status:"", last:null, timer:null};
function syncSaveCfg(){ writeLocal("sync", {cfg:SY.cfg, meta:SY.meta}); }
function markDirty(key){
  if(!SY.cfg) return;
  if(!SY.meta.dirty.includes(key)) SY.meta.dirty.push(key);
  syncSaveCfg(); syncSoon(2500);
}
function syncSoon(ms){ clearTimeout(SY.timer); SY.timer = setTimeout(syncNow, ms); }
const b64e = s => btoa(unescape(encodeURIComponent(s)));
const b64d = s => decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
async function gh(path, opts={}){
  const r = await fetch("https://api.github.com/repos/"+SY.cfg.owner+"/"+SY.cfg.repo+"/contents/"+path, {
    cache:"no-store", ...opts,
    headers:{"Authorization":"Bearer "+SY.cfg.token, "Accept":"application/vnd.github+json", ...(opts.body?{"Content-Type":"application/json"}:{})}
  });
  if(r.status===404) return null;
  if(!r.ok){ const e = new Error(r.status===401||r.status===403 ? "GitHub не принял ключ доступа. Проверьте ключ и права Contents: Read and write." : "GitHub ответил ошибкой "+r.status); e.status = r.status; throw e; }
  return r.json();
}
function adopt(key, obj){
  if(key==="state"){ S = Object.assign(DEFAULTS(), obj); migrate(); }
  else if(key==="news"){ NEWS = obj; }
  else M[key] = Object.assign({days:{}, weeks:{}, mchecks:{}, scores:{}, review:""}, obj);
  writeLocal(key, obj);
}
async function syncNow(){
  if(!SY.cfg || mode==="db") return;
  if(SY.busy){ SY.again = true; return; }
  if(!navigator.onLine){ SY.status = "нет сети, синхронизирую позже"; setSync(); return; }
  SY.busy = true; SY.status = "синхронизация…"; setSync();
  let pulled = false;
  try{
    const list = (await gh("")) || [];
    const remote = {};
    for(const f of list){ if(f.type==="file" && /^(state|news|m-\d{4}-\d{2})\.json$/.test(f.name)) remote[f.name.slice(0,-5)] = f.sha; }
    // pull what changed on the other device
    for(const key in remote){
      if(SY.meta.sha[key]===remote[key]) continue;
      const f = await gh(key+".json");
      if(!f) continue;
      let obj; try{ obj = JSON.parse(b64d(f.content)); }catch(e){ continue; }
      const local = getDoc(key);
      const localDirty = SY.meta.dirty.includes(key);
      if(!localDirty || !local || (obj._upd||0) > (local._upd||0)){
        if(timers[key]) continue; // the user is typing into this doc right now
        adopt(key, obj); pulled = true;
        SY.meta.dirty = SY.meta.dirty.filter(k=>k!==key);
      }
      SY.meta.sha[key] = remote[key];
    }
    // first connection: send local docs the repository does not have yet
    const localKeys = [...(S.start ? ["state"] : []), ...Object.keys(M).filter(k=>Object.keys(M[k].days||{}).length || Object.keys(M[k].scores||{}).length || M[k].review), ...(NEWS ? ["news"] : [])];
    for(const k of localKeys) if(!remote[k] && !SY.meta.dirty.includes(k)) SY.meta.dirty.push(k);
    // push local changes
    for(const key of [...SY.meta.dirty]){
      const obj = getDoc(key); if(!obj){ SY.meta.dirty = SY.meta.dirty.filter(k=>k!==key); continue; }
      try{
        const res = await gh(key+".json", {method:"PUT", body: JSON.stringify({message:"sync "+key, content: b64e(JSON.stringify(obj)), ...(remote[key]||SY.meta.sha[key] ? {sha: SY.meta.sha[key]||remote[key]} : {})})});
        SY.meta.sha[key] = res.content.sha;
        SY.meta.dirty = SY.meta.dirty.filter(k=>k!==key);
      }catch(e){
        if(e.status===409 || e.status===422){ delete SY.meta.sha[key]; SY.again = true; } else throw e;
      }
    }
    SY.last = new Date(); SY.status = "";
  }catch(e){
    SY.status = e.status ? e.message : "нет связи с GitHub, повторю позже";
  }
  syncSaveCfg();
  SY.busy = false; setSync();
  if(pulled) scheduleRender();
  if(SY.again){ SY.again = false; syncSoon(1500); }
}
function setSync(){
  const el = document.getElementById("syncstate");
  if(el) el.textContent = syncLabel();
  const el2 = document.getElementById("savestate");
  if(el2 && SY.cfg) el2.textContent = SY.status || (SY.last ? "синхр. "+pad(SY.last.getHours())+":"+pad(SY.last.getMinutes()) : "");
}
function syncLabel(){
  if(!SY.cfg) return "Не подключено";
  if(SY.status) return SY.status;
  return SY.last ? "Синхронизировано в "+pad(SY.last.getHours())+":"+pad(SY.last.getMinutes()) : "Подключено";
}
function syncInit(saved){
  if(saved && saved.cfg && saved.cfg.token){ SY.cfg = saved.cfg; SY.meta = Object.assign({sha:{}, dirty:[]}, saved.meta||{}); }
  if(!SY.cfg) return;
  syncNow();
  setInterval(syncNow, 90*1000);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") syncNow(); });
  window.addEventListener("online", () => syncNow());
}
function migrate(){
  if(!S.queueV){ // разовая расстановка рекомендуемой очереди для уже сохранённых данных
    const rank = b => { const i = QUEUE.indexOf(b.id); return i<0 ? 999 : i; };
    S.books = S.books.map((b,i)=>({b,i})).sort((x,y)=>(rank(x.b)-rank(y.b)) || (x.i-y.i)).map(x=>x.b);
    S.books.forEach(b => { if(b.audio===undefined) b.audio = AUDIO_FRIENDLY.includes(b.id); });
    S.queueV = 1;
  }
  S.books.forEach(b => { if(RENAMED[b.title]){ b.title = RENAMED[b.title]; } });
}

function persist(kind, key){
  // kind: "state" | "month"
  const tk = kind==="state" ? "state" : key;
  const obj = kind==="state" ? S : M[key];
  if(obj) obj._upd = Date.now();
  clearTimeout(timers[tk]);
  setSave("сохраняю…");
  timers[tk] = setTimeout(async () => {
    delete timers[tk];
    try{
      if(mode==="mac" || (WEB && mode==="local")){
        writeLocal(tk, getDoc(tk)); markDirty(tk);
      } else if(mode==="db"){
        if(kind==="state") await db.doc("data/users/"+uidStr+"/state").set(JSON.parse(JSON.stringify(S)));
        else await db.doc("data/users/"+uidStr+"/"+key).set(JSON.parse(JSON.stringify(M[key])));
      } else {
        try{ localStorage.setItem("perez:"+tk, JSON.stringify(kind==="state"?S:M[key])); }catch(e){}
      }
      setSave("сохранено");
    }catch(e){
      setSave(e && e.code==="quota_exceeded" ? "хранилище заполнено" : "не сохранилось, повторите действие");
    }
  }, 700);
}
const saveState = () => { if(!S.start){ S.start = today(); } persist("state"); };
const saveMonth = key => persist("month", key);

/* ---------- boot ---------- */
async function boot(){
  if(MAC || WEB){
    let store = {};
    if(MAC){ mode = "mac"; store = window.__PEREZ || {}; }
    else {
      mode = "local";
      try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.startsWith("perez:")) store[k.slice(6)] = JSON.parse(localStorage.getItem(k)); } }catch(e){}
    }
    if(store.state) S = Object.assign(DEFAULTS(), store.state);
    migrate();
    if(store.news) NEWS = store.news;
    for(const k in store){ if(k.startsWith("m-")) M[k] = Object.assign({days:{}, weeks:{}, mchecks:{}, scores:{}, review:""}, store[k]); }
    ui.allLoaded = true;
    render();
    pushReminders();
    syncInit(store.sync);
    return;
  }
  const fallback = setTimeout(() => { if(mode==="loading") startLocal("Не удалось связаться с хранилищем. Пока данные сохраняются только в этом браузере."); }, 10000);
  let dbx = null, user = null;
  try{ [dbx, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]); }catch(e){}
  let uid = null;
  try{ uid = user ? await user.id() : null; }catch(e){}
  if(!dbx || !uid){ clearTimeout(fallback); startLocal("Вы не вошли в claude.ai или хранилище недоступно. Данные сохраняются только в этом браузере."); return; }
  db = dbx; uidStr = uid;
  const now = new Date(), prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
  let gotState = false;
  db.doc("data/users/"+uid+"/state").onSnapshot(snap => {
    if(mode==="local") return;
    if(!snap.metadata.fromCache || snap.exists){ gotState = true; clearTimeout(fallback); }
    if(timers.state || snap.metadata.hasPendingWrites) return;
    if(snap.exists){ S = Object.assign(DEFAULTS(), structuredClone(snap.data())); }
    if(gotState){ mode = "db"; scheduleRender(); }
  }, err => { clearTimeout(fallback); if(mode==="loading") startLocal("Хранилище недоступно. Данные сохраняются только в этом браузере."); });
  for(const k of [mkey(now), mkey(prev)]){
    db.doc("data/users/"+uid+"/"+k).onSnapshot(snap => {
      if(timers[k] || snap.metadata.hasPendingWrites) return;
      if(snap.exists) M[k] = Object.assign({days:{}, weeks:{}, mchecks:{}, scores:{}, review:""}, structuredClone(snap.data()));
      if(mode==="db") scheduleRender();
    }, () => {});
  }
}
function startLocal(msg){
  mode = "local"; ui.localMsg = msg;
  try{
    const s = localStorage.getItem("perez:state"); if(s) S = Object.assign(DEFAULTS(), JSON.parse(s));
    for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.startsWith("perez:m-")) M[k.slice(6)] = JSON.parse(localStorage.getItem(k)); }
  }catch(e){}
  render();
}
async function loadAllMonths(){
  if(mode!=="db" || ui.allLoaded) return;
  ui.allLoaded = true;
  try{
    const qs = await db.collection("data/users/"+uidStr).get();
    for(const d of qs.docs){ if(d.id.startsWith("m-") && !timers[d.id]) M[d.id] = structuredClone(d.data()); }
    scheduleRender();
  }catch(e){ ui.allLoaded = false; }
}

function scheduleRender(){
  const a = document.activeElement;
  if(a && (a.tagName==="TEXTAREA" || (a.tagName==="INPUT" && a.type==="text")) && a.closest("#view")){ pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if(pendingRender){ pendingRender = false; setTimeout(render, 0); } });

/* ---------- derived ---------- */
function dayDone(dateStr){
  const d = M[mkey(parse(dateStr))]?.days?.[dateStr]?.h || {};
  const n = S.habits.filter(h => d[h.id]).length;
  return S.habits.length ? n / S.habits.length : 0;
}
function streak(){
  let n = 0, d = new Date();
  if(dayDone(ds(d)) < .75) d = addDays(d,-1);
  while(dayDone(ds(d)) >= .75 && n < 400){ n++; d = addDays(d,-1); }
  return n;
}
function personStatus(p){
  if(!p.last) return {cls:"bad", t:"не было контакта"};
  const n = daysBetween(p.last, today());
  if(n <= 60) return {cls:"ok", t: n===0 ? "сегодня" : n+" "+plural(n,"день","дня","дней")+" назад"};
  if(n <= 90) return {cls:"warn", t: n+" дней назад"};
  return {cls:"bad", t: n+" дней назад"};
}

/* ---------- render ---------- */
const TABS = [["today","Сегодня"],["news","Новости"],["books","Книги"],["people","Люди"],["topics","Слово"],["biz","Дело"],["month","Месяц"],["system","Система"]];
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(([k,t]) =>
    `<button class="tab" role="tab" id="tab-${k}" aria-selected="${tab===k}" data-tab="${k}">${t}</button>`).join("");
}
function render(){
  applyPal();
  renderTabs();
  const start = S.start || today();
  const dn = daysBetween(start, today()) + 1;
  document.getElementById("daycount").innerHTML = `день <b>${dn}</b> из 365<br><span id="savestate"></span>`;
  const v = document.getElementById("view");
  const banner = mode==="local" ? `<p class="notice">${esc(ui.localMsg)}</p>` : "";
  v.innerHTML = banner + ({today:vToday, news:vNews, books:vBooks, people:vPeople, topics:vTopics, biz:vBiz, month:vMonth, system:vSystem}[tab])();
  if(tab==="month") loadAllMonths();
}

function checkBtn(act, key, title, hint, on){
  return `<button class="check" data-act="${act}" data-id="${esc(key)}" aria-pressed="${!!on}"><span class="box"></span><span class="t">${esc(title)}${hint?`<small>${esc(hint)}</small>`:""}</span></button>`;
}

function vToday(){
  const t = today(), d = new Date();
  const mk = mkey(d), md = month(mk);
  const day = md.days[t] || {};
  const h = day.h || {}, j = day.j || {};
  const doneN = S.habits.filter(x => h[x.id]).length;
  const wk = "w-"+ds(monday(d)), wmk = mkey(monday(d));
  const wchecks = (M[wmk]?.weeks?.[wk]) || {};
  const wDone = S.weekly.filter(x => wchecks[x.id]).length;
  const daysLeft = 7 - ((d.getDay()+6)%7) - 1;
  const rule = S.rules.length ? S.rules[(daysBetween("2026-01-01", t) % S.rules.length + S.rules.length) % S.rules.length].text : "";
  const reading = S.books.filter(b => b.status==="reading");
  // heat: last 28 days
  const cells = [];
  for(let i=27;i>=0;i--){ const x = ds(addDays(d,-i)); const r = dayDone(x); const l = r===0?0:r<.5?1:r<1?2:3; cells.push(`<i data-l="${l}" class="${i===0?"today":""}" title="${human(x)}: ${Math.round(r*100)}%"></i>`); }
  const booksYear = S.books.filter(b => b.status==="done" && b.done && b.done.slice(0,4)===String(d.getFullYear())).length;
  // nudges
  const nudges = [];
  const overdue = S.people.filter(p => personStatus(p).cls!=="ok").length;
  if(S.people.length < 30) nudges.push(`В списке людей ${S.people.length} из 30. Добавьте ещё во вкладке «Люди».`);
  else if(overdue) nudges.push(`${overdue} ${plural(overdue,"человек","человека","человек")} из списка давно без контакта.`);
  const prevKey = mkey(new Date(d.getFullYear(), d.getMonth()-1, 1));
  if(d.getDate()<=5 && !Object.keys(M[prevKey]?.scores||{}).length && S.start && S.start < ds(new Date(d.getFullYear(), d.getMonth(), 1))) nudges.push(`Оцените прошлый месяц во вкладке «Месяц».`);
  const due = S.decisions.filter(x => x.check && x.check<=t && !x.result).length;
  if(due) nudges.push(`Пора сверить ${due} ${plural(due,"решение","решения","решений")} в дневнике решений.`);
  if(!reading.length) nudges.push(`Сейчас нет книги в чтении. Выберите следующую во вкладке «Книги».`);
  if(d.getDay()===0) nudges.push(`Сегодня воскресенье: время итогов недели.`);

  return `
  <section class="card">
    <div class="eyebrow">${WD[d.getDay()]}, ${human(t)} · правило дня</div>
    <div class="rule-day">${esc(rule)}</div>
  </section>
  ${wordCard(false)}
  <section class="card">
    <div class="between"><h2>Каждый день</h2><span class="num sub">${doneN} / ${S.habits.length}</span></div>
    <div class="prog"><i style="width:${S.habits.length?doneN/S.habits.length*100:0}%"></i></div>
    <div class="checks">${S.habits.map(x => checkBtn("habit", x.id, x.title, x.hint, h[x.id])).join("")}</div>
  </section>
  <section class="card">
    <h2>Дневник дня</h2>
    <label class="f">Что сделал<textarea id="j-did" data-act="journal" data-k="did" rows="2">${esc(j.did)}</textarea></label>
    <label class="f">Что понял или узнал нового<textarea id="j-learned" data-act="journal" data-k="learned" rows="2">${esc(j.learned)}</textarea></label>
    <label class="f">Что сделаю завтра<textarea id="j-tomorrow" data-act="journal" data-k="tomorrow" rows="2">${esc(j.tomorrow)}</textarea></label>
  </section>
  ${NEWS && NEWS.items && NEWS.items.length ? `<section class="card"><div class="between"><h2>Главное ${NEWS.date===t?"сегодня":"за "+human(NEWS.date)}</h2><button class="btn sm ghost" data-tab="news">Вся сводка →</button></div>
    <div class="list">${NEWS.items.slice(0,3).map(n=>`<div class="item"><div class="body"><div class="title">${esc(n.title)}</div><div class="meta">${esc(n.topic)}</div></div></div>`).join("")}</div></section>` : ""}
  ${nudges.length ? `<section class="card"><h2>Что пора сделать</h2><div class="list">${nudges.map(n=>`<div class="item"><div class="body">${esc(n)}</div></div>`).join("")}</div></section>` : ""}
  <section class="card">
    <div class="between"><h2>Эта неделя</h2><span class="num sub">${wDone} / ${S.weekly.length} · ${daysLeft===0?"последний день":"ещё "+daysLeft+" "+plural(daysLeft,"день","дня","дней")}</span></div>
    <div class="checks">${S.weekly.map(x => checkBtn("weekly", x.id, x.title, x.hint, wchecks[x.id])).join("")}</div>
  </section>
  <section class="card">
    <h2>Ритм за 4 недели</h2>
    <div class="heat">${cells.join("")}</div>
    <div class="stats">
      <div class="stat"><b class="num">${streak()}</b><span>дней подряд</span></div>
      <div class="stat"><b class="num">${booksYear}<small style="font-size:13px;color:var(--muted)">/${S.bookGoal}</small></b><span>книг за год</span></div>
      <div class="stat"><b class="num">${S.people.filter(p=>personStatus(p).cls==="ok").length}</b><span>живых контактов</span></div>
    </div>
    ${reading.length?`<p class="sub">Сейчас: ${reading.map(b=>(b.audio?"🎧 ":"")+"«"+esc(b.title)+"»").join(", ")}</p>`:""}
  </section>`;
}

    <div class="between"><span class="row">${(n.sources||[]).map(s=>`<a href="${esc(s.link)}" target="_blank" rel="noopener" class="sub" style="color:var(--indigo)">${esc(s.source)}</a>`).join(" · ")}</span>

function vBooks(){
  const cats = ["Очередь", "Все", ...new Set(S.books.map(b=>b.cat).filter(Boolean)), "🎧 Для дороги", "Прочитано"];
  const f = ui.bookFilter;
  const queue = f==="Очередь";
  const list = queue
    ? [...S.books.filter(b=>b.status==="reading"), ...S.books.filter(b=>b.status==="plan")]
    : S.books.filter(b => f==="Все" || (f==="🎧 Для дороги" ? b.audio && b.status!=="done" : f==="Прочитано" ? b.status==="done" : b.cat===f));
  const planIds = S.books.filter(b=>b.status==="plan").map(b=>b.id);
  const y = String(new Date().getFullYear());
  const doneY = S.books.filter(b=>b.status==="done" && (b.done||"").slice(0,4)===y).length;
  const row = b => {
    if(ui.editing==="book:"+b.id) return bookForm(b);
    const pos = planIds.indexOf(b.id);
    const num = queue && b.status==="plan" ? `<span class="num" style="flex:0 0 26px;color:${pos===0?"var(--accent)":"var(--muted)"};font-size:14px;padding-top:1px">${pos+1}</span>` : "";
    const move = queue && b.status==="plan" ? `<span class="acts" style="flex-direction:column;gap:0"><button class="icon" data-act="book-up" data-id="${b.id}" aria-label="Выше" ${pos===0?"disabled":""}>↑</button><button class="icon" data-act="book-down" data-id="${b.id}" aria-label="Ниже" ${pos===planIds.length-1?"disabled":""}>↓</button></span>` : "";
    const label = b.status==="reading" && b.audio ? "слушаю" : STATUS[b.status];
    const next = queue && pos===0 ? `<span class="pill" style="color:var(--accent);cursor:default;margin-left:6px">следующая</span>` : "";
    const tick = `<button class="check remcheck" data-act="book-done" data-id="${b.id}" aria-pressed="${b.status==="done"}" aria-label="${b.status==="done"?"Вернуть в очередь":"Отметить прочитанной"}" title="${b.status==="done"?"Вернуть в очередь":"Прочитано"}" style="margin-top:1px"><span class="box"></span></button>`;
    return `<div class="item">${num}${tick}<div class="body"><div class="title">${esc(b.title)}${next}</div><div class="meta">${esc(b.author)}${b.cat?" · "+esc(b.cat):""}${b.done&&b.status==="done"?" · "+human(b.done):""}</div>${b.note?`<div class="meta" style="color:var(--fg);margin-top:4px">${esc(b.note)}</div>`:""}${b.status!=="done"?bookLinks(b):""}</div>
      <span class="acts" style="flex-direction:column;align-items:flex-end;gap:6px"><button class="pill ${b.status}" data-act="book-status" data-id="${b.id}" title="Сменить статус">${label}</button>
      <button class="icon" data-act="book-audio" data-id="${b.id}" title="${b.audio?"Буду слушать в дороге":"Отметить: слушать в дороге"}" aria-pressed="${!!b.audio}" style="${b.audio?"color:var(--accent)":""}">🎧</button></span>${move}${itemActs("book", b.id)}</div>`;
  };
  return `
  <section class="card">
    <div class="between"><h2>Книги</h2><span class="num sub">${doneY} из ${S.bookGoal} за ${y}</span></div>
    <div class="prog"><i style="width:${Math.min(100,doneY/S.bookGoal*100)}%"></i></div>
    <p class="sub">«Очередь» показывает порядок чтения: сверху то, что читаете сейчас, дальше следующие книги. Стрелками ↑↓ меняйте порядок. Галочка слева отмечает книгу прочитанной, и очередь сдвигается. Статус справа переключается нажатием: в планах → читаю → прочитано. 🎧 отмечает книги, которые удобно слушать в дороге. Ссылки ведут на поиск книги в Литресе, Яндекс Книгах и MyBook.</p>
    <details class="sub" style="margin:8px 0 4px"><summary style="cursor:pointer;color:var(--accent)">Как читать бесплатно через библиотеку</summary>
      <ol style="margin:6px 0 0;padding-left:20px;line-height:1.5">
        <li>Один раз сходите с паспортом в Библиотеку им. Маяковского (наб. Фонтанки, 44, ежедневно 11–21): читательский билет оформят за 15 минут. Виртуальный билет с сайта для Литрес не подходит. <a href="https://pl.spb.ru/for-readers/services/" target="_blank" rel="noopener" style="color:var(--indigo)">Условия на сайте</a></li>
        <li>Там же попросите доступ к «Литрес: Библиотека». Библиотекарь выдаст логин и пароль.</li>
        <li>Войдите с ними на biblio.litres.ru или в приложении «Литрес» (вход «Я читатель библиотеки»).</li>
        <li>Нажмите у книги «Библиотека: бесплатно», затем «Взять в библиотеке». Книга выдаётся на 2–3 недели, популярные иногда в очереди.</li>
      </ol>
    </details>
    <div class="filters">${cats.map(c=>`<button class="chip" data-act="book-filter" data-id="${esc(c)}" aria-pressed="${f===c}">${esc(c)}</button>`).join("")}</div>
    <div class="list">${list.map(row).join("") || `<div class="empty">Здесь пока пусто.</div>`}</div>
    ${ui.adding==="book" ? bookForm(null) : `<button class="btn" data-act="add" data-kind="book">+ Добавить книгу</button>`}
  </section>`;
}
function bookForm(b){
  b = b || {title:"",author:"",cat:"",note:""};
  return `<form class="form" data-form="book" data-id="${b.id||""}">
    <label class="f">Название<input type="text" id="bf-title-${b.id||"new"}" name="title" value="${esc(b.title)}" required></label>
    <label class="f">Автор<input type="text" id="bf-author-${b.id||"new"}" name="author" value="${esc(b.author)}"></label>
    <label class="f">Раздел<input type="text" id="bf-cat-${b.id||"new"}" name="cat" value="${esc(b.cat)}" list="cats"></label>
    <datalist id="cats">${[...new Set(S.books.map(x=>x.cat))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <label class="f" style="flex-basis:100%">Главная мысль<textarea id="bf-note-${b.id||"new"}" name="note" rows="2">${esc(b.note)}</textarea></label>
    <div class="row"><button class="btn pri" type="submit">Сохранить</button><button class="btn ghost" type="button" data-act="cancel">Отмена</button></div>
  </form>`;
}

function vPeople(){
  const list = [...S.people].sort((a,b) => (a.last||"") < (b.last||"") ? -1 : 1);
  const row = p => {
    if(ui.editing==="person:"+p.id) return personForm(p);
    const st = personStatus(p);
    return `<div class="item"><div class="body"><div class="title">${esc(p.name)}</div><div class="meta">${esc(p.who)}</div>${p.note?`<div class="meta" style="color:var(--fg);margin-top:4px">${esc(p.note)}</div>`:""}
      <div class="row" style="margin-top:6px"><span class="pill ${st.cls}" style="cursor:default">${st.t}</span><button class="btn sm" data-act="contact" data-id="${p.id}">Связался сегодня</button></div></div>${itemActs("person", p.id)}</div>`;
  };
  return `
  <section class="card">
    <div class="between"><h2>Мои 30 человек</h2><span class="num sub">${S.people.length} / 30</span></div>
    <p class="sub">Люди сильнее вас: предприниматели, руководители, эксперты. Связь хотя бы раз в 2 месяца. Сначала даёте пользу, потом просите. Наверху списка те, с кем вы давно не общались.</p>
    <div class="list">${list.map(row).join("") || `<div class="empty">Список пуст. Начните с 5 человек, которых уже знаете, потом добавляйте по одному в месяц.</div>`}</div>
    ${ui.adding==="person" ? personForm(null) : `<button class="btn" data-act="add" data-kind="person">+ Добавить человека</button>`}
  </section>`;
}
function personForm(p){
  p = p || {name:"",who:"",note:"",last:""};
  const k = p.id||"new";
  return `<form class="form" data-form="person" data-id="${p.id||""}">
    <label class="f">Имя<input type="text" id="pf-name-${k}" name="name" value="${esc(p.name)}" required></label>
    <label class="f">Кто он, чем полезен<input type="text" id="pf-who-${k}" name="who" value="${esc(p.who)}"></label>
    <label class="f">Последний контакт<input type="date" id="pf-last-${k}" name="last" value="${esc(p.last||"")}"></label>
    <label class="f" style="flex-basis:100%">Заметки: интересы, о чём говорили<textarea id="pf-note-${k}" name="note" rows="2">${esc(p.note)}</textarea></label>
    <div class="row"><button class="btn pri" type="submit">Сохранить</button><button class="btn ghost" type="button" data-act="cancel">Отмена</button></div>
  </form>`;
}

{"w":"Демаго́гия","t":"Переговоры","d":"Убеждение через игру на эмоциях, лести и ложных обещаниях вместо фактов и логики.","m":"Распознав демагогию, вы не дадите собой манипулировать и сами не уроните доверие.","ex":["Обещание «удвоить зарплаты всем» без расчётов — чистая демагогия.","На собрании он перешёл в демагогию, когда закончились аргументы.","Против демагогии работает один вопрос: «Покажите расчёт».","Демагогия даёт быстрые аплодисменты и медленный провал."]},
{"w":"Кауза́льность","t":"Мышление","d":"Причинно-следственная связь: одно событие действительно вызывает другое.","m":"Корреляция ещё не причина. Ошибка тут стоит денег в рекламе, найме и стратегии.","ex":["Продажи выросли после рекламы, но каузальность не доказана: был ещё и сезон.","Чтобы проверить каузальность, мы запустили акцию только в двух точках из пяти.","Аналитик спутал корреляцию с каузальностью и дал неверный совет.","В истории каузальность почти всегда сложнее, чем кажется в учебнике."]},
{"w":"Хеджи́рование","t":"Деньги","d":"Страховка от неблагоприятного движения цен или курса с помощью встречной сделки или контракта.","m":"Защищает маржу от того, на что вы не влияете: курс, цены на сырьё.","ex":["Мы хеджировали закупку кормов фиксированной ценой на год.","Хеджирование стоит денег, но спасает в резкий скачок курса.","Ресторан хеджирует риск, заключая долгий договор аренды с фиксированной ставкой.","Не хеджировать валюту при импортных закупках — ставка на удачу."]},
{"w":"Меритокра́тия","t":"Власть","d":"Принцип, при котором должности и влияние получают по заслугам и способностям.","m":"Меритократия в команде притягивает сильных и отпугивает приспособленцев.","ex":["Сингапур Ли Куан Ю построен на меритократии в госслужбе.","В нашей сети повышение только по результатам — это меритократия, а не дружба.","Меритократия работает, только если заслуги измеряют прозрачно.","Он говорил о меритократии, но назначал своих знакомых."]},
{"w":"Имплика́ция","t":"Мышление","d":"Следствие, которое вытекает из факта или решения, даже если не сказано прямо.","m":"Сильные игроки думают на два шага вперёд: какие импликации у этого решения?","ex":["Импликация нового закона: малым кафе станет невыгодно работать с алкоголем.","Обдумайте импликации, прежде чем повышать цены сразу во всех точках.","Его слова имели скрытую импликацию: без скидки сделки не будет.","Аналитики спорят об импликациях решения ЦБ для кредитов бизнесу."]},
{"w":"Дью-дилидженс","t":"Деньги","d":"Комплексная проверка компании или сделки перед покупкой или инвестициями.","m":"Покупая бизнес без дью-дилидженс, вы покупаете чужие скрытые долги.","ex":["Дью-дилидженс выявил налоговую задолженность, и цену снизили на треть.","Хороший дью-дилидженс включает юридическую, финансовую и операционную проверку.","Инвестор провёл дью-дилидженс за месяц, прежде чем дать деньги.","Сделка сорвалась на этапе дью-дилидженс: отчётность не сходилась."]},
{"w":"Эскала́ция","t":"Переговоры","d":"Постепенное усиление конфликта или передача вопроса на более высокий уровень.","m":"Умение вовремя эскалировать — и вовремя остановить эскалацию — признак зрелого руководителя.","ex":["Если подрядчик не ответит до пятницы, это эскалация к их директору.","Эскалация конфликта с арендодателем стоила нам больше, чем уступка.","Крис Восс учит снижать эскалацию тоном и вопросами.","Эскалация санкций изменила логистику всего бизнеса."]},
{"w":"Суверените́т","t":"Мир","d":"Полная самостоятельность и независимость государства (или человека) в принятии решений.","m":"В личном смысле — финансовая и профессиональная независимость, которую стоит строить.","ex":["Технологический суверенитет стал главной темой промышленной политики.","Подушка в год расходов даёт личный суверенитет: можно отказывать.","Спор о суверенитете над территорией длится десятилетиями.","Собственный бизнес — путь к суверенитету от чужих решений."]},
{"w":"Опциона́льность","t":"Мышление","d":"Наличие выбора без обязательства: право воспользоваться возможностью, но не обязанность.","m":"Талеб: собирайте опции — дешёвые возможности, которые могут выстрелить.","ex":["Мы сняли помещение с правом выкупа — это опциональность на будущее.","Знакомства с сильными людьми дают опциональность: неизвестно, какое окажется ключевым.","Не сжигайте мосты, сохраняйте опциональность.","Опциональность ценнее точного плана в неопределённом мире."]},
{"w":"Субордина́ция","t":"Власть","d":"Порядок подчинения младших по должности старшим и соблюдение служебной иерархии.","m":"Без субординации команда расползается, но жёсткая душит инициативу.","ex":["Он нарушил субординацию и пошёл с вопросом сразу к собственнику.","В кухне ресторана субординация почти армейская, иначе хаос.","Сохраняйте субординацию на людях и спорьте наедине.","Ясная субординация снимает вопрос «кто решает»."]},
{"w":"Арбитра́ж","t":"Деньги","d":"Заработок на разнице цен одного товара на разных рынках или в разное время.","m":"Многие состояния начинались с арбитража: увидеть, где дёшево, и продать, где дорого.","ex":["Он начинал с арбитража: возил технику из Китая и продавал в регионах.","Арбитражные возможности исчезают, как только их замечают многие.","Арбитраж трафика — закупить рекламу дешевле, чем приносят клиенты.","Также арбитраж — суд по экономическим спорам: «Подаём в арбитраж»."]},
{"w":"Казуи́стика","t":"Переговоры","d":"Изворотливость в доказательстве ложного или сомнительного через формальные детали.","m":"Распознав казуистику, не дадите увести себя от сути на мелочи.","ex":["Юрист прибегнул к казуистике: формально договор не нарушен, по сути — обман.","Не втягивайтесь в казуистику, возвращайте разговор к главному вопросу.","Его отчёт был образцом казуистики: всё верно, но ничего не понятно.","Казуистика выигрывает спор, но теряет доверие."]},
{"w":"Энтропи́я","t":"Мышление","d":"Мера беспорядка. Любая система без вложения энергии стремится к хаосу.","m":"Бизнес без постоянного управления деградирует сам по себе. Это закон, а не невезение.","ex":["Через полгода без собственника в ресторане началась энтропия: стандарты поползли.","Регулярные чек-листы — борьба с энтропией.","Энтропия в отношениях: без внимания связи остывают.","Закон энтропии объясняет, почему порядок всегда требует усилий."]},
{"w":"Стейкхо́лдер","t":"Власть","d":"Заинтересованная сторона: любой, кого затрагивает решение и кто может на него влиять.","m":"Перед большим решением составьте карту стейкхолдеров: кто выиграет, кто проиграет, кто помешает.","ex":["Ключевые стейкхолдеры проекта: администрация, жители и арендатор.","Он забыл учесть одного стейкхолдера, и стройку остановили жалобы.","С каждым стейкхолдером нужно говорить на языке его интереса.","Стейкхолдеры бизнеса — не только акционеры, но и сотрудники с клиентами."]},
{"w":"Протекциони́зм","t":"Мир","d":"Политика защиты внутреннего рынка от иностранной конкуренции пошлинами и ограничениями.","m":"Протекционизм меняет правила игры для целых отраслей — видеть это заранее выгодно.","ex":["Протекционизм в сельском хозяйстве помог местным птицефабрикам.","Торговая война — это протекционизм с обеих сторон.","Протекционизм защищает производителя, но часто бьёт по покупателю ценами.","Экономисты спорят, ведёт ли протекционизм к росту или к застою."]},
{"w":"Апелля́ция","t":"Переговоры","d":"Обращение к чему-то как к доводу (к авторитету, чувствам, закону) или обжалование решения.","m":"Узнавая тип апелляции, видите, где факт, а где давление.","ex":["Апелляция к авторитету: «Так делают все крупные сети» — ещё не довод.","Мы подали апелляцию на решение суда первой инстанции.","Его речь строилась на апелляции к страху, а не к цифрам.","Сильный аргумент сочетает апелляцию к логике и к ценностям."]},
{"w":"Масшта́бируемость","t":"Деньги","d":"Способность бизнеса расти без пропорционального роста затрат и усилий собственника.","m":"Именно масштабируемость отличает доход от капитала.","ex":["Дизайн-студия плохо масштабируется: каждый проект требует лучших людей.","Масштабируемость франшизы зависит от того, насколько процессы описаны.","Онлайн-продукт масштабируется почти бесплатно, ресторан — нет.","Инвесторы платят за масштабируемость, а не за текущую прибыль."]},
{"w":"Прагмати́зм","t":"Мышление","d":"Подход, при котором ценность идеи определяется её практическим результатом.","m":"Прагматизм помогает отказываться от красивых, но неработающих решений.","ex":["Ли Куан Ю прославился прагматизмом: брал то, что работает, независимо от идеологии.","Из прагматизма мы оставили старую кассовую систему ещё на год.","Прагматизм не равен цинизму: цели остаются, меняются методы.","В переговорах его прагматизм помог найти решение быстрее всех."]},
{"w":"Патрона́ж","t":"Власть","d":"Покровительство влиятельного человека, который продвигает и защищает своих.","m":"Понимание системы патронажа объясняет, как на самом деле делаются карьеры наверху.","ex":["Карьера чиновника шла под патронажем бывшего губернатора.","Патронаж открывает двери, но делает вас зависимым.","В эпоху Медичи искусство держалось на патронаже меценатов.","Сильные люди строят не патронаж, а взаимные альянсы."]},
{"w":"Диверсифика́ция","t":"Деньги","d":"Распределение денег или бизнеса по разным направлениям, чтобы снизить риск.","m":"Не держать всё в одной корзине — но и не распыляться так, что ничего не растёт.","ex":["Диверсификация спасла холдинг: когда клубы закрыли, выручку держали магазины.","Баффет называет диверсификацию защитой от незнания.","Слишком широкая диверсификация размывает внимание собственника.","Диверсификация клиентов: ни один не должен давать больше 20% выручки."]},
{"w":"Кулуа́рный","t":"Власть","d":"Происходящий неофициально, за закрытыми дверями, вне публичного обсуждения.","m":"Многие важные решения принимаются кулуарно. Нужно быть в комнате, где их обсуждают.","ex":["Вопрос решили кулуарно ещё до официального совещания.","Кулуарные договорённости на форуме важнее программы выступлений.","Он избегал кулуарных игр и проиграл тем, кто в них играл.","Кулуарный разговор с ключевым акционером снял все возражения."]},
{"w":"Стагфля́ция","t":"Мир","d":"Сочетание экономического застоя, высокой безработицы и роста цен одновременно.","m":"Худший режим для бизнеса: спрос падает, а затраты растут. Важно узнавать его признаки.","ex":["В 1970-х США пережили стагфляцию после нефтяного шока.","Признаки стагфляции: цены растут, а продажи стоят.","В стагфляцию выигрывает тот, у кого низкие издержки и запас денег.","Экономисты предупреждают о риске стагфляции при высоких ставках."]},
{"w":"Рито́рика","t":"Переговоры","d":"Искусство убедительной и выразительной речи.","m":"Большие люди влияют речью: на совещании, на сцене, в разговоре один на один.","ex":["Сильная риторика — это ясная мысль, пример и пауза.","Его риторика вдохновляла, но цифры потом не сходились.","Цицерон учил риторике через три задачи: научить, увлечь, убедить.","Перед выступлением потренируйте риторику на записи телефона."]},
{"w":"Комплае́нс","t":"Деньги","d":"Соответствие деятельности компании законам, правилам и внутренним стандартам.","m":"Крупный бизнес растёт, только когда комплаенс защищает его от штрафов и потери лицензий.","ex":["Банк попросил документы по комплаенсу перед открытием кредитной линии.","Нарушение комплаенса с алкогольной лицензией может закрыть бар.","Мы ввели простой комплаенс: два человека подписывают каждый платёж.","Западные партнёры не работают с компаниями без внятного комплаенса."]},
{"w":"Дихотоми́я","t":"Мышление","d":"Деление на две противоположные части. Также ложный выбор «или-или».","m":"Стоики: дихотомия контроля — тратьте силы только на то, что зависит от вас.","ex":["Дихотомия контроля Эпиктета: что в моей власти, а что нет.","«Или качество, или скорость» — ложная дихотомия, бывает и то и другое.","Его мышление страдало от дихотомии: всё либо идеально, либо провал.","Дихотомия «свой — чужой» мешает видеть союзников."]},
{"w":"Непоти́зм","t":"Власть","d":"Продвижение родственников и друзей на должности независимо от их способностей.","m":"Непотизм убивает мотивацию сильных сотрудников быстрее, чем низкая зарплата.","ex":["Назначение брата на закупки было чистым непотизмом и стоило нам миллионы.","Семейный бизнес должен различать доверие и непотизм.","Непотизм в госаппарате снижает доверие граждан.","Лучшие команды держатся подальше от непотизма."]},
{"w":"Экстраполя́ция","t":"Мышление","d":"Перенос текущей тенденции на будущее или на другие случаи.","m":"Самая частая ошибка прогнозов: линейная экстраполяция удачного года.","ex":["Экстраполяция роста первого года дала нереальный план на пять лет.","Экстраполяция полезна, но мир меняет направление.","Аналитики экстраполировали спрос и построили лишние мощности.","Экстраполяция одного удачного опыта на всех клиентов — ошибка."]},
{"w":"Капитализа́ция","t":"Деньги","d":"Рыночная стоимость компании; также превращение прибыли в капитал.","m":"Богатство считают капитализацией бизнеса, а не годовым доходом.","ex":["Капитализация компании выросла вдвое после выхода на биржу.","Он реинвестировал прибыль — капитализация процентов работает на него.","Сильный бренд увеличивает капитализацию сверх стоимости активов.","Капитализация зависит не от прошлого, а от ожиданий рынка."]},
{"w":"Нарратив","t":"Переговоры","d":"История, через которую люди объясняют события и придают им смысл.","m":"Кто управляет нарративом, тот управляет восприятием: инвесторов, команды, рынка.","ex":["Стартап продаёт нарратив о будущем, а не текущие цифры.","После провала важно сразу задать свой нарратив, иначе это сделают за вас.","Политики соревнуются нарративами, а не программами.","Сильный нарратив компании объединяет команду лучше премий."]},
{"w":"Синеку́ра","t":"Власть","d":"Хорошо оплачиваемая должность, не требующая реального труда.","m":"Понимать, где в организации синекуры, — значит видеть скрытые расходы и связи.","ex":["Должность «советника» оказалась синекурой для родственника партнёра.","Он отказался от синекуры и ушёл строить своё дело.","В крупных корпорациях синекуры прячут в непрозрачных отделах.","Сокращение синекур дало быструю экономию бюджета."]},
{"w":"Резилье́нтность","t":"Мышление","d":"Способность быстро восстанавливаться после ударов и адаптироваться к трудностям.","m":"Не избежать ударов, а держать их и возвращаться сильнее — качество больших людей.","ex":["Резильентность бизнеса проверяется в первый кризис.","Его резильентность после банкротства впечатляла: через год новый проект.","Сон, спорт и сильное окружение повышают личную резильентность.","Запас денег — основа финансовой резильентности."]},
{"w":"Бе́нчмарк","t":"Деньги","d":"Эталон для сравнения: показатель лучших на рынке, с которым сверяют свои результаты.","m":"Без бенчмарков вы не знаете, хорошо ли работаете или просто привыкли.","ex":["Бенчмарк по фудкосту для пиццерии — 25–30%.","Мы сравнили конверсию сайта с бенчмарком отрасли и увидели отставание вдвое.","Фонд считает доходность относительно бенчмарка — индекса.","Найдите бенчмарк у лидера рынка, а не у соседа."]},
{"w":"Оппортуни́зм","t":"Власть","d":"Поведение, при котором человек меняет позицию ради выгоды, без принципов.","m":"Важно отличать гибкость от оппортунизма — и у партнёров, и у себя.","ex":["Его оппортунизм проявился сразу: переметнулся к конкуренту, как только предложили больше.","Деловой оппортунизм — хвататься за любую выгодную возможность, даже вне стратегии.","Защита от оппортунизма партнёров — грамотный договор.","Политика полна оппортунизма: союзы меняются вместе с рейтингами."]},
{"w":"Интроспе́кция","t":"Мышление","d":"Наблюдение за собственными мыслями, чувствами и мотивами изнутри.","m":"Без интроспекции решения принимают эмоции, а вы потом находите им оправдание.","ex":["Интроспекция показала: я спорил не из-за денег, а из-за самолюбия.","Марк Аврелий вёл записи как ежедневную интроспекцию.","Пять минут интроспекции перед важным решением сберегают месяцы.","Интроспекция полезна, но проверяйте выводы обратной связью других."]},

{"w":"Фидуциа́рный","t":"Деньги","d":"Основанный на доверии: когда один человек управляет чужими деньгами или делами в интересах другого.","m":"Если вы управляете деньгами партнёров, у вас фидуциарная ответственность — это серьёзно.","ex":["Директор несёт фидуциарную ответственность перед акционерами.","Фидуциарный долг управляющего — действовать в интересах инвестора, а не своих.","Бумажные деньги — фидуциарные: их ценность держится на доверии.","Нарушение фидуциарных обязанностей ведёт к суду и потере репутации."]},

{"w":"Калибро́вочный вопро́с","t":"Переговоры","d":"Открытый вопрос «как?» или «что?», который заставляет собеседника решать вашу проблему.","m":"Вместо «нет» спросите «Как мне это сделать?» — и собеседник сам ищет решение.","ex":["«Как мне уложиться в этот бюджет?» — калибровочный вопрос вместо отказа.","Калибровочные вопросы дают собеседнику иллюзию контроля, а вам — информацию.","«Что для вас здесь самое важное?» — лучший калибровочный вопрос."]},

const wordAt = (off=0) => { const n = WORDS.length; const i = ((daysBetween("2026-11-08", today()) + off) % n + n) % n; return {i, x: WORDS[i]}; };
const wordCard = (full) => {
  const off = full ? (ui.wordOff||0) : 0, {i, x} = wordAt(off);
  const known = (S.wordsKnown||{})[i];
  const label = off===0 ? "Слово дня" : off<0 ? (off===-1 ? "Вчерашнее слово" : `${-off} дн. назад`) : (off===1 ? "Завтрашнее слово" : `Через ${off} дн.`);
  if(!full) return `<section class="card"><div class="eyebrow">${label} · ${esc(x.t)}</div><div class="word">${esc(x.w)}</div><p style="margin:0">${esc(x.d)}</p>
    <button class="btn sm ghost" data-tab="topics" style="align-self:flex-start">Примеры и смысл →</button></section>`;
  return `<section class="card">
    <div class="between"><div class="eyebrow">${label} · ${esc(x.t)} · ${i+1} из ${WORDS.length}</div>
      <span class="row" style="gap:2px"><button class="icon" data-act="word-nav" data-id="-1" aria-label="Предыдущее">←</button>${off?`<button class="icon" data-act="word-nav" data-id="0">сегодня</button>`:""}<button class="icon" data-act="word-nav" data-id="1" aria-label="Следующее">→</button></span></div>
    <div class="word">${esc(x.w)}</div>
    <p style="margin:0">${esc(x.d)}</p>
    <p class="notice" style="margin:0"><b style="color:var(--fg)">Зачем вам:</b> ${esc(x.m)}</p>
    <div class="eyebrow">Примеры</div>
    <ol class="ex">${x.ex.map(e=>`<li>${esc(e)}</li>`).join("")}</ol>
    <p class="sub">Используйте слово сегодня хотя бы раз: в разговоре, письме или дневнике.</p>
    ${checkBtn("word", String(i), known ? "Запомнил" : "Отметить: запомнил", known ? "Отмечено "+human(known) : "", !!known)}
  </section>`;
};
// прошлые слова: раскрывающийся список, у каждого слова свои примеры (открытое состояние помним в ui)
const pastWords = () => {
  const n = Math.min(daysBetween("2026-11-08", today()), WORDS.length - 1);
  if(n <= 0) return "";
  ui.wOpen ||= {};
  const rows = [];
  for(let k=1; k<=n; k++){
    const {i, x} = wordAt(-k), known = (S.wordsKnown||{})[i];
    const date = human(ds(addDays(new Date(), -k)));
    rows.push(`<details class="pw" data-wkey="w${i}" ${ui.wOpen["w"+i]?"open":""}>
      <summary><span class="pw-w">${esc(x.w)}</span><span class="meta">${date} · ${esc(x.t)}${known?" · ✓ запомнил":""}</span></summary>
      <div class="pw-b"><p style="margin:0">${esc(x.d)}</p>
        <p class="notice" style="margin:0"><b style="color:var(--fg)">Зачем вам:</b> ${esc(x.m)}</p>
        <ol class="ex">${x.ex.map(e=>`<li>${esc(e)}</li>`).join("")}</ol></div>
    </details>`);
  }
  return `<section class="card"><details data-wkey="all" ${ui.wOpen.all?"open":""}>
    <summary class="pw-head"><h2 style="display:inline">Прошлые слова</h2> <span class="num sub">${n}</span></summary>
    <div class="list" style="margin-top:12px">${rows.join("")}</div></details></section>`;
};
document.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.wkey; if(k){ ui.wOpen ||= {}; ui.wOpen[k] = e.target.open; } }, true);
function vTopics(){

  return wordCard(true) + pastWords() + `
  <section class="card">
    <h2>Кругозор: 3 факта + 1 мнение</h2>
    <p class="sub">По каждой теме держите три свежих факта и своё мнение, которое можете объяснить. Тема краснеет, если вы не обновляли её больше месяца.</p>
  </section>
  <div class="grid2">${S.topics.map(x => {
    const age = x.updated ? daysBetween(x.updated, t) : null;
    const st = age===null ? {cls:"bad",t:"пусто"} : age<=30 ? {cls:"ok",t:"обновлено "+human(x.updated)} : {cls:"bad",t:"устарело: "+human(x.updated)};
    if(ui.editing==="topic:"+x.id) return `<form class="topic" data-form="topic" data-id="${x.id}"><label class="f">Тема<input type="text" id="tf-${x.id}" name="title" value="${esc(x.title)}" required></label><div class="row"><button class="btn pri sm" type="submit">Сохранить</button><button class="btn ghost sm" type="button" data-act="cancel">Отмена</button></div></form>`;
    return `<div class="topic"><div class="between"><b>${esc(x.title)}</b>${itemActs("topic", x.id)}</div>
      <span class="pill ${st.cls}" style="align-self:flex-start;cursor:default">${st.t}</span>
      <label class="f">Три факта<textarea id="tp-f-${x.id}" data-act="topic-field" data-id="${x.id}" data-k="facts" rows="3" placeholder="1. …&#10;2. …&#10;3. …">${esc(x.facts)}</textarea></label>

function gcal(title, details, start, mins, rrule){
  const f = dt => dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+"T"+pad(dt.getHours())+pad(dt.getMinutes())+"00";
  const end = new Date(start.getTime()+mins*60000);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&details="+encodeURIComponent(details)+"&dates="+f(start)+"/"+f(end)+"&recur="+encodeURIComponent("RRULE:"+rrule);
}
function nextAt(h, m, pred){
  let d = new Date(); d.setHours(h, m, 0, 0);
  for(let i=0;i<400;i++){ if(d > new Date() && pred(d)) return d; d = addDays(d,1); d.setHours(h,m,0,0); }
  return d;
}

const LISTS = {book:"books", person:"people", topic:"topics", biz:"biz", decision:"decisions", habit:"habits", weekly:"weekly", monthly:"monthly", rule:"rules", capital:"capitals", yeargoal:"year"};
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-act]");
  if(!t) return;
  if(t.dataset.tab){ tab = t.dataset.tab; ui.editing = ui.adding = ui.confirmDel = null; render(); window.scrollTo(0,0); return; }
  const a = t.dataset.act, iid = t.dataset.id, kind = t.dataset.kind;
  const d = new Date(), td = today();
  if(a==="habit"){
    const md = month(mkey(d)); const day = (md.days[td] ||= {}); const h = (day.h ||= {});
    h[iid] = !h[iid]; saveMonth(mkey(d)); render();
  } else if(a==="weekly"){
    const wmk = mkey(monday(d)), wk = "w-"+ds(monday(d)); const md = month(wmk); const w = (md.weeks[wk] ||= {});
    w[iid] = !w[iid]; saveMonth(wmk); render();
  } else if(a==="mcheck"){
    const mk = ui.monthKey || mkey(d); const md = month(mk); md.mchecks ||= {}; md.mchecks[iid] = !md.mchecks[iid]; saveMonth(mk); render();
  } else if(a==="score"){
    const mk = ui.monthKey || mkey(d); const md = month(mk); md.scores ||= {}; const v = Number(t.dataset.v);
    md.scores[iid] = md.scores[iid]===v ? undefined : v; if(md.scores[iid]===undefined) delete md.scores[iid]; saveMonth(mk); render();
  } else if(a==="month-nav"){ ui.monthKey = iid; render(); }
  else if(a==="year"){ const y = S.year.find(x=>x.id===iid); y.done = !y.done; saveState(); render(); }
  else if(a==="step"){ const s = S.next.steps.find(x=>x.id===iid); s.done = !s.done; saveState(); render(); }
  else if(a==="step-del"){ S.next.steps = S.next.steps.filter(x=>x.id!==iid); saveState(); render(); }
  else if(a==="book-status"){
    const b = S.books.find(x=>x.id===iid); b.status = {plan:"reading", reading:"done", done:"plan"}[b.status];
    b.done = b.status==="done" ? td : null; saveState(); render();
  } else if(a==="book-done"){
    // галочка: прочитано — книга уходит из очереди, следующая поднимается; повторное нажатие возвращает в планы
    const b = S.books.find(x=>x.id===iid);
    if(b.status==="done"){ b.status = "plan"; b.done = null; } else { b.status = "done"; b.done = td; }
    saveState(); render();
  } else if(a==="book-filter"){ ui.bookFilter = iid; render(); }
  else if(a==="sync-now"){ syncNow(); }
  else if(a==="sync-off"){ SY.cfg = null; SY.meta = {sha:{}, dirty:[]}; syncSaveCfg(); render(); }
  else if(a==="word"){ S.wordsKnown ||= {}; if(S.wordsKnown[iid]) delete S.wordsKnown[iid]; else S.wordsKnown[iid] = td; saveState(); render(); }
  else if(a==="word-nav"){ ui.wordOff = iid==="0" ? 0 : (ui.wordOff||0) + Number(iid); render(); }
  else if(a==="pal"){ S.pal = iid; saveState(); render(); }
  else if(a==="book-audio"){ const b = S.books.find(x=>x.id===iid); b.audio = !b.audio; saveState(); render(); }
  else if(a==="book-up" || a==="book-down"){
    const plan = S.books.filter(b=>b.status==="plan"); const i = plan.findIndex(b=>b.id===iid); const j = a==="book-up" ? i-1 : i+1;
    if(j>=0 && j<plan.length){
      const ia = S.books.indexOf(plan[i]), ib = S.books.indexOf(plan[j]);
      [S.books[ia], S.books[ib]] = [S.books[ib], S.books[ia]]; saveState(); render();
    }
  }
  else if(a==="contact"){ const p = S.people.find(x=>x.id===iid); p.last = td; saveState(); render(); }
  else if(a==="add"){ ui.adding = kind; ui.editing = null; render(); document.querySelector("form[data-form] input[type=text]")?.focus(); }
  else if(a==="edit"){ ui.editing = kind+":"+iid; ui.adding = null; render(); }
  else if(a==="cancel"){ ui.editing = ui.adding = null; render(); }
  else if(a==="del"){ ui.confirmDel = kind+":"+iid; render(); }
  else if(a==="del-no"){ ui.confirmDel = null; render(); }
  else if(a==="del-yes"){ const L = LISTS[kind]; S[L] = S[L].filter(x=>x.id!==iid); ui.confirmDel = null; saveState(); render(); }
  else if(a==="news-refresh"){ newsStatus = "loading"; render(); window.webkit.messageHandlers.news.postMessage({action:"refresh"}); }
  else if(a==="news-save"){ const n = NEWS.items[Number(iid)]; ui.newsSaved ||= {}; ui.newsSaved[iid] = addToTopic(n.topic, n.title + ": " + String(n.summary).split(/(?<=\.)\s/)[0]); render(); }
  else if(a==="fact-save"){ ui.factSaved = addToTopic(NEWS.factTopic, NEWS.fact); render(); }
  else if(a==="login"){ window.webkit.messageHandlers.login.postMessage({on: !LOGIN}); }
  else if(a==="rem-on"){ const r = S.reminders.find(x=>x.id===iid); r.on = !r.on; saveState(); pushReminders(); render(); }
  else if(a==="export" && MAC){ window.webkit.messageHandlers.export.postMessage({filename:"perezagruzka-"+td+".json", data: JSON.stringify({state:S, months:M}, null, 2)}); }
  else if(a==="export"){
    const dl = await window.claude?.use?.("downloads");
    const data = JSON.stringify({state:S, months:M}, null, 2);
    if(!dl){ t.textContent = "Скачивание недоступно здесь"; return; }
    try{ await dl.save({filename:"perezagruzka-"+td+".json", data}); }catch(err){}
  }
});

document.addEventListener("input", e => {
  const t = e.target; const a = t.dataset.act; if(!a) return;
  const d = new Date();
  if(a==="journal"){ const mk = mkey(d); const md = month(mk); const day = (md.days[today()] ||= {}); (day.j ||= {})[t.dataset.k] = t.value; saveMonth(mk); }
  else if(a==="topic-field"){ const x = S.topics.find(y=>y.id===t.dataset.id); x[t.dataset.k] = t.value; x.updated = today(); saveState(); }
  else if(a==="biz-field"){ const x = S.biz.find(y=>y.id===t.dataset.id); x[t.dataset.k] = t.value; saveState(); }
  else if(a==="next-field"){ S.next[t.dataset.k] = t.value; saveState(); }
  else if(a==="review"){ const mk = ui.monthKey || mkey(d); month(mk).review = t.value; saveMonth(mk); }
});

document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.act==="rem-time" && t.value){ const r = S.reminders.find(x=>x.id===t.dataset.id); r.time = t.value; saveState(); pushReminders(); }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if(!f) return;
  e.preventDefault();
  const kind = f.dataset.form, iid = f.dataset.id; const v = Object.fromEntries(new FormData(f).entries());
  for(const k in v) v[k] = String(v[k]).trim();
  if(kind==="step"){ if(v.text){ S.next.steps.push({id:id(), text:v.text, done:false}); saveState(); } render(); document.getElementById("step-new")?.focus(); return; }
  if(kind==="sync"){
    if(!v.owner || !v.repo || !v.token) return;
    SY.cfg = {owner:v.owner.replace(/^@/,""), repo:v.repo, token:v.token}; SY.meta = {sha:{}, dirty:[]};
    syncSaveCfg(); render(); syncInit(null); return;
  }
  if(kind==="settings"){ if(v.start) S.start = v.start; const g = parseInt(v.goal,10); if(g>0) S.bookGoal = g; saveState(); render(); return; }
  const L = LISTS[kind]; let obj = iid ? S[L].find(x=>x.id===iid) : null;
  if(kind==="book"){ if(!v.title) return; obj ? Object.assign(obj, {title:v.title, author:v.author, cat:v.cat, note:v.note}) : S.books.push({id:id(), title:v.title, author:v.author, cat:v.cat, note:v.note, status:"plan", done:null}); }
  else if(kind==="person"){ if(!v.name) return; obj ? Object.assign(obj, {name:v.name, who:v.who, note:v.note, last:v.last||null}) : S.people.push({id:id(), name:v.name, who:v.who, note:v.note, last:v.last||null}); }
  else if(kind==="topic"){ if(!v.title) return; obj ? (obj.title = v.title) : S.topics.push({id:id(), title:v.title, facts:"", opinion:"", updated:null}); }
  else if(kind==="biz"){ if(!v.name) return; obj ? (obj.name = v.name) : S.biz.push({id:id(), name:v.name, worked:"", failed:"", skill:""}); }
  else if(kind==="decision"){ if(!v.text) return; obj ? Object.assign(obj, {text:v.text, why:v.why, check:v.check, result:v.result||""}) : S.decisions.push({id:id(), date:today(), text:v.text, why:v.why, check:v.check, result:""}); }
  else if(kind==="rule"){ if(!v.title) return; obj ? (obj.text = v.title) : S.rules.push({id:id(), text:v.title}); }
  else if(kind==="yeargoal"){ if(!v.title) return; obj ? (obj.text = v.title) : S.year.push({id:id(), text:v.title, done:false}); }
  else { if(!v.title) return; obj ? Object.assign(obj, {title:v.title, hint:v.hint||""}) : S[L].push({id:id(), title:v.title, hint:v.hint||""}); }
  ui.editing = ui.adding = null; saveState(); render();
});

renderTabs();
boot();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}</script>
